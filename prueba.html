<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba federación</title>
<style>body{font-family:system-ui,sans-serif;padding:16px;max-width:600px;margin:auto}
button{font-size:18px;padding:12px 20px;border-radius:10px;border:0;background:#1f3864;color:#fff}
#r{margin-top:16px;padding:14px;border-radius:10px;background:#eee;white-space:pre-wrap;font-size:16px}
.ok{background:#d7f0d9!important}.mal{background:#f8d7d3!important}</style></head>
<body>
<h2>Prueba de acceso directo a la federación</h2>
<p>Pulsa el botón. Esta prueba pide los partidos directamente desde este dispositivo, sin pasar por el Worker.</p>
<button id="b">Probar ahora</button>
<div id="r">Esperando…</div>
<script>
const r = document.getElementById("r");
document.getElementById("b").onclick = async () => {
  r.className = ""; r.textContent = "Probando…";
  const d = new Date(), p = n => String(n).padStart(2, "0");
  const fecha = `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  try {
    const res = await fetch("https://resultadosbalonmano.isquad.es/json/partidos_equipos_consultas.php", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded; charset=UTF-8" },
      body: new URLSearchParams({ accion: "obtener_partidos", id_ambito: "20", fecha_actual: fecha, consulta: "0", id_superficie: "1" })
    });
    const txt = await res.text();
    if (res.ok) {
      r.className = "ok";
      r.textContent = "✅ FUNCIONA. Estado " + res.status + ".\nLa federación acepta la petición directa desde este dispositivo.\nRecibidos " + txt.length + " caracteres.\n\nInicio: " + txt.slice(0, 120);
    } else {
      r.className = "mal";
      r.textContent = "❌ La federación respondió estado " + res.status + ".\n\nInicio: " + txt.slice(0, 120);
    }
  } catch (e) {
    r.className = "mal";
    r.textContent = "❌ FALLO: " + e.message + "\n\nProbablemente el navegador la bloquea por CORS (la federación no permite que otras webs lean sus datos).";
  }
};
</script></body></html>
